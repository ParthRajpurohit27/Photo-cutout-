<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#58cc02">
  <title>Parth's 18th Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="balloons" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="app">
    <div class="chip rise" style="--d:0s"><span class="cake">🎂</span> Parth's 18th Birthday</div>

    <section id="hero" class="hero rise" style="--d:.08s" data-mood="idle">
      <div class="mascot-box">
        <img id="mascot" class="mascot" src="photos/mascot.png" alt="Parth" width="289" height="1000" draggable="false">
        <div class="shadow"></div>
      </div>
      <div id="bubble" class="bubble pop">
        <p id="say" aria-live="polite">Namaste! Meri 18th birthday hai 🎉 Apni poori photo daalo, main tere saath khada ho jaunga!</p>
        <small id="sub"></small>
      </div>
    </section>

    <h1 class="rise" style="--d:.16s">Mere saath photo khichwao!</h1>

    <input id="file" type="file" accept="image/*" hidden>
    <label id="pick" class="btn rise" style="--d:.24s" for="file">Upload your full photo here</label>

    <div id="progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
      <div class="track">
        <div id="fill" class="fill"></div>
        <img id="rider" class="rider" src="photos/mascot-head.png" alt="" draggable="false">
      </div>
      <div class="meta"><span id="pct">0%</span><span id="eta"></span></div>
      <p id="stage" class="stage"></p>
      <div class="arena-wrap">
        <div class="arena-head"><span>Intezaar me balloons phodo! 🎈</span><b id="score">🎈 0</b></div>
        <div id="arena" class="arena"></div>
      </div>
      <ol id="steps" class="steps"></ol>
    </div>

    <a id="download" class="btn btn-blue" hidden>Download photo</a>
  </main>

  <footer class="foot">Made with love by <a href="https://parth27.vercel.app" target="_blank" rel="noopener noreferrer">Parth Rajpurohit</a></footer>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
